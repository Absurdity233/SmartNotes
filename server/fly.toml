# Fly.io 部署配置
#
# 用法：cd server && fly launch --no-deploy，再照此文件调整后 fly deploy
# 注意：Fly 的免费额度已收紧，部署前先确认账户计费状态。
app = "smartnotes-cloud"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  SMARTNOTES_DATA_DIR = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

# 持久化卷：SQLite 与上传的图片都存在这里
[[mounts]]
  source = "smartnotes_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
