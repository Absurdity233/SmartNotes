services:
  smartnotes:
    build: .
    container_name: smartnotes
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - SMARTNOTES_DATA_DIR=/data
    volumes:
      - smartnotes-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  smartnotes-data:
